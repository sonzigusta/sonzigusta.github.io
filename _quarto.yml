project:
  type: website
  output-dir: _site
  post-render: scripts/version-site.ts
  render:
    - index.qmd
    - notes.qmd
    - about.qmd
    - writing.qmd
    - posts/**/*.qmd
  resources:
    - assets/**
    - .nojekyll

website:
  title: SWR Notes
  description: Seungmin Wave & Radio Frequency Notes
  site-url: https://sonzigusta.github.io
  favicon: assets/swr-symbol.svg
  search: false
  draft-mode: gone
  navbar:
    background: "#10363d"
    foreground: "#ffffff"
    title: false
    logo: assets/swr-logo.png
    logo-alt: SWR Notes
    collapse-below: md
    right:
      - text: Home
        href: index.qmd
      - text: Notes
        href: notes.qmd
      - text: About me
        href: about.qmd
  page-footer:
    left: SWR Notes · Seungmin Son
    right:
      - text: Writing guide
        href: writing.qmd
      - text: GitHub
        href: https://github.com/sonzigusta/sonzigusta.github.io
  repo-url: https://github.com/sonzigusta/sonzigusta.github.io
  repo-actions: [edit]

format:
  html:
    theme: cosmo
    css: assets/styles.css
    html-math-method: mathjax
    toc: false
    number-sections: false
    date-format: YYYY.MM.DD
    anchor-sections: false
    code-copy: true

bibliography: references.bib
execute:
  enabled: false
